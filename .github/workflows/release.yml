name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-7zip
      - name: build
        run: |
          mingw32-make clean
          mingw32-make
      - name: package
        run: |
          mkdir -p pkg/assets
          cp BadApple.exe pkg/
          cp config.json pkg/
          cp README.md pkg/
          cp LICENSE pkg/
          cp assets/frames.bin pkg/assets/
          cp assets/audio.wav pkg/assets/
          7z a BadApple_windows.zip ./pkg/*
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: BadApple_windows.zip

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          make clean
          make -j$(nproc)
      - name: package
        run: |
          mkdir -p pkg/assets
          cp bad_apple pkg/
          cp config.json pkg/
          cp README.md pkg/
          cp LICENSE pkg/
          cp assets/frames.bin pkg/assets/
          cp assets/audio.wav pkg/assets/
          tar czf BadApple_linux.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: BadApple_linux.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            # Bad Apple Terminal Player ${{ github.ref_name }}

            在终端里播放 Bad Apple。

            ## 安装

            | 平台 | 文件 |
            |------|------|
            | Windows | `BadApple_windows.zip` |
            | Linux | `BadApple_linux.tar.gz` |

            下载完解压运行 `BadApple.exe` 即可。

            ## 更新内容

            此为第一个 `Release`。
          files: |
            artifacts/windows-zip/BadApple_windows.zip
            artifacts/linux-tar/BadApple_linux.tar.gz
          draft: false
          prerelease: false