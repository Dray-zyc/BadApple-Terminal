name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # 1. 升级 checkout 到 v5 以解决 Node.js 20 警告
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          # 2. 将 msystem 从 MINGW64 更换为 UCRT64
          msystem: UCRT64
          update: true
          # 3. 安装 UCRT64 环境下的构建工具
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-binutils
      - name: build
        run: |
          # 使用 make 命令，而不是 mingw32-make
          make clean
          make
      - name: package
        run: |
          mkdir -p pkg/assets
          cp BadApple.exe pkg/
          cp config.json pkg/
          cp README.md pkg/
          cp LICENSE pkg/
          cp assets/frames.bin pkg/assets/
          cp assets/audio.wav pkg/assets/
          7z a BadApple_windows.zip ./pkg/*
      # 4. 升级 upload-artifact 到 v5
      - uses: actions/upload-artifact@v5
        with:
          name: windows-zip
          path: BadApple_windows.zip